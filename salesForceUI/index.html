<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesForce UI</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <div id="header">
            <div id="logo">
                <img src="https://a.sfdcstatic.com/shared/images/c360-nav/salesforce-with-type-logo.svg">
            </div>
            <div class="texts">
                <p>Products</p>
            </div>
            <div class="texts">
                <p>Industries</p>
            </div>
            <div class="texts">
                <p>Customers</p>
            </div>
            <div class="texts">
                <p>Learning</p>
            </div>
            <div class="texts">
                <p>Support</p>
            </div>
            <div class="texts" style="display: flex;">
                <p>More</p>
                <i class="ri-arrow-down-line"></i>
            </div>
            <div id="contactDetails">
                <p><u>Contact Us</u></p>
                <p>0000-00-0000</p>
            </div>
            <div class="icon"><i class="ri-search-line"></i></div>
            <div class="icon"><i class="ri-global-line"></i></div>
            <div id="login">
                <i class="ri-user-3-fill"></i>
                <p>Login</p>
            </div>
            <div id="try">
                <p>try for free</p>
            </div>
        </div>
        <div id="fakeheader"></div>
        <div id="page1">
            <div id="strip">
                <p>Just Announced: see why gartner recognised recognised salesforce as a leader in Custormer Data
                    platforms.</p>
                <p><u>Read the report</u></p>
            </div>
            <div id="content">
                <div id="box1"></div>
                <div id="box2"></div>
            </div>
            <div id="heading">
                <h1>Learn What Salesforce products can do for you.</h1>
            </div>
        </div>
        <div id="page2"></div>
    </div>
</body>

</html>
